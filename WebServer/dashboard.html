<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arduino Monitoring System with AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #333; min-height: 100vh; padding: 20px; }
        
        .container { max-width: 1400px; margin: 0 auto; }
        
        .header { background: rgba(255, 255, 255, 0.95); padding: 20px; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); display: flex; justify-content: space-between; align-items: center; }
        
        .header h1 { color: #2d3436; font-size: 28px; }
        
        .header h1 i { color: #667eea; margin-right: 10px; }
        
        .status-badge { padding: 10px 20px; background: #00b894; color: white; border-radius: 50px; font-weight: bold; display: flex; align-items: center; gap: 10px; }
        
        .dashboard-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        
        .main-panel { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        
        .card { background: rgba(255, 255, 255, 0.95); border-radius: 15px; padding: 25px; box-shadow: 0 8px 25px rgba(0,0,0,0.1); transition: transform 0.3s; }
        
        .card:hover { transform: translateY(-5px); }
        
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid #f1f2f6; }
        
        .card-title { font-size: 20px; color: #2d3436; display: flex; align-items: center; gap: 10px; }
        
        .value { font-size: 48px; font-weight: bold; color: #667eea; margin: 10px 0; }
        
        .unit { font-size: 20px; color: #636e72; margin-left: 5px; }
        
        .sub-value { color: #636e72; font-size: 16px; margin-top: 5px; }
        
        .ai-chat { grid-column: span 2; min-height: 400px; display: flex; flex-direction: column; }
        
        .chat-messages { flex: 1; overflow-y: auto; padding: 15px; background: #f8f9fa; border-radius: 10px; margin: 15px 0; max-height: 300px; }
        
        .message { padding: 12px 15px; margin-bottom: 10px; border-radius: 10px; animation: fadeIn 0.3s; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.info { background: #e3f2fd; border-left: 4px solid #2196f3; }
        .message.warning { background: #fff3cd; border-left: 4px solid #ff9800; }
        .message.danger { background: #f8d7da; border-left: 4px solid #dc3545; }
        .message.success { background: #d4edda; border-left: 4px solid #28a745; }
        
        .message-time { font-size: 12px; color: #888; margin-top: 5px; text-align: right; }
        
        .controls { display: flex; gap: 10px; margin-top: 15px; }
        
        .btn { padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 8px; transition: all 0.3s; }
        
        .btn-primary { background: #667eea; color: white; }
        .btn-primary:hover { background: #5a6fd8; }
        
        .btn-success { background: #00b894; color: white; }
        .btn-success:hover { background: #00a085; }
        
        .chart-container { height: 300px; margin-top: 20px; }
        
        @media (max-width: 1200px) { .dashboard-grid { grid-template-columns: 1fr; } }
        @media (max-width: 768px) { .main-panel { grid-template-columns: 1fr; } .ai-chat { grid-column: span 1; } .value { font-size: 36px; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-microchip"></i> Arduino Monitoring System with AI</h1>
            <div class="status-badge">
                <i class="fas fa-circle" id="statusIcon"></i>
                <span id="statusText">Подключение...</span>
            </div>
        </div>
        
        <div class="dashboard-grid">
            <div class="main-panel">
                <!-- Температура -->
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">
                            <i class="fas fa-thermometer-half" style="color: #e17055;"></i>
                            Температура
                        </div>
                    </div>
                    <div class="value" id="temperature">--</div>
                    <div class="unit">°C</div>
                    <div class="sub-value" id="tempStatus">Статус: --</div>
                </div>
                
                <!-- Влажность -->
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">
                            <i class="fas fa-tint" style="color: #0984e3;"></i>
                            Влажность
                        </div>
                    </div>
                    <div class="value" id="humidity">--</div>
                    <div class="unit">%</div>
                    <div class="sub-value" id="humStatus">Статус: --</div>
                </div>
                
                <!-- Вибрации -->
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">
                            <i class="fas fa-vibrate" style="color: #00b894;"></i>
                            Вибрации
                        </div>
                    </div>
                    <div class="value" id="vibrations">0</div>
                    <div class="unit">уд/мин</div>
                    <div class="sub-value">Всего ударов: <span id="totalHits">0</span></div>
                </div>
                
                <!-- Риск -->
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">
                            <i class="fas fa-exclamation-triangle" style="color: #d63031;"></i>
                            Риск отказа
                        </div>
                    </div>
                    <div class="value" id="riskScore">0%</div>
                    <div class="sub-value" id="riskLevel">Уровень: Низкий</div>
                </div>
                
                <!-- AI Чат -->
                <div class="card ai-chat">
                    <div class="card-header">
                        <div class="card-title">
                            <i class="fas fa-robot" style="color: #6c5ce7;"></i>
                            AI Рекомендации
                        </div>
                        <button class="btn btn-primary" onclick="loadAIChat()">
                            <i class="fas fa-sync"></i> Обновить
                        </button>
                    </div>
                    
                    <div class="chat-messages" id="aiChat">
                        <div class="message info">
                            <div>🤖 AI система ожидает данных...</div>
                            <div class="message-time">Загружено</div>
                        </div>
                    </div>
                    
                    <div class="controls">
                        <button class="btn btn-success" onclick="simulateWarning()">
                            <i class="fas fa-bell"></i> Тест
                        </button>
                        <button class="btn btn-primary" onclick="showHistory()">
                            <i class="fas fa-history"></i> История
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- Боковая панель с графиками -->
            <div class="card">
                <div class="card-header">
                    <div class="card-title">
                        <i class="fas fa-chart-line"></i>
                        Графики (60 минут)
                    </div>
                    <button class="btn btn-primary" onclick="refreshCharts()" style="padding: 8px 15px; font-size: 14px;">
                        <i class="fas fa-sync"></i>
                    </button>
                </div>
                
                <!-- График температуры -->
                <div class="sub-value">Температура:</div>
                <div class="chart-container">
                    <canvas id="tempChart"></canvas>
                </div>
                
                <!-- График влажности -->
                <div class="sub-value" style="margin-top: 20px;">Влажность:</div>
                <div class="chart-container">
                    <canvas id="humChart"></canvas>
                </div>
                
                <!-- График вибраций -->
                <div class="sub-value" style="margin-top: 20px;">Вибрации:</div>
                <div class="chart-container">
                    <canvas id="vibChart"></canvas>
                </div>
                
                <div class="controls" style="margin-top: 20px;">
                    <button class="btn btn-primary" onclick="exportData()">
                        <i class="fas fa-download"></i> Экспорт
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let ws;
        let tempChart, humChart, vibChart;
        
        // WebSocket
        function initWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws`;
            
            ws = new WebSocket(wsUrl);
            
            ws.onopen = function() {
                updateStatus(true);
                loadInitialData();
                loadCharts();
            };
            
            ws.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    handleWebSocketMessage(data);
                } catch (e) {
                    console.error('Ошибка:', e);
                }
            };
            
            ws.onclose = function() {
                updateStatus(false);
                setTimeout(initWebSocket, 3000);
            };
        }
        
        function updateStatus(connected) {
            const icon = document.getElementById('statusIcon');
            const text = document.getElementById('statusText');
            
            if (connected) {
                icon.style.color = '#00b894';
                text.textContent = 'Подключено';
            } else {
                icon.style.color = '#e17055';
                text.textContent = 'Отключено';
            }
        }
        
        function handleWebSocketMessage(data) {
            if (data.type === 'realtime') {
                updateDashboard(data.data);
                // Обновляем графики новыми данными
                addDataToCharts(data.data);
            } else if (data.type === 'ai_recommendation') {
                addChatMessage(data.data);
            }
        }
        
        function updateDashboard(data) {
            // Температура
            if (data.temperature !== undefined) {
                const temp = data.temperature.toFixed(1);
                document.getElementById('temperature').textContent = temp;
                
                let tempStatus = 'Норма';
                let tempColor = '#00b894';
                if (data.temperature > 35) {
                    tempStatus = 'Критично';
                    tempColor = '#e17055';
                } else if (data.temperature > 30) {
                    tempStatus = 'Повышена';
                    tempColor = '#fdcb6e';
                } else if (data.temperature < 15) {
                    tempStatus = 'Низкая';
                    tempColor = '#0984e3';
                }
                
                document.getElementById('tempStatus').textContent = `Статус: ${tempStatus}`;
                document.getElementById('tempStatus').style.color = tempColor;
            }
            
            // Влажность
            if (data.humidity !== undefined) {
                const hum = data.humidity.toFixed(1);
                document.getElementById('humidity').textContent = hum;
                
                let humStatus = 'Норма';
                let humColor = '#00b894';
                if (data.humidity > 80) {
                    humStatus = 'Высокая';
                    humColor = '#e17055';
                } else if (data.humidity > 60) {
                    humStatus = 'Повышена';
                    humColor = '#fdcb6e';
                } else if (data.humidity < 20) {
                    humStatus = 'Низкая';
                    humColor = '#0984e3';
                }
                
                document.getElementById('humStatus').textContent = `Статус: ${humStatus}`;
                document.getElementById('humStatus').style.color = humColor;
            }
            
            // Вибрации
            if (data.hits_per_minute !== undefined) {
                const hits = parseFloat(data.hits_per_minute);
                document.getElementById('vibrations').textContent = hits.toFixed(1);
                
                // Цвет вибраций
                if (hits > 30) {
                    document.getElementById('vibrations').style.color = '#e17055';
                } else if (hits > 20) {
                    document.getElementById('vibrations').style.color = '#fdcb6e';
                } else if (hits > 10) {
                    document.getElementById('vibrations').style.color = '#00b894';
                } else {
                    document.getElementById('vibrations').style.color = '#667eea';
                }
                
                // Обновляем риск
                updateRiskFromHits(hits);
            }
            
            // Общее количество ударов
            if (data.hit_count !== undefined) {
                document.getElementById('totalHits').textContent = data.hit_count;
            }
        }
        
        function updateRiskFromHits(hitsPerMinute) {
            let riskPercent, riskLevel, riskColor;
            
            if (hitsPerMinute > 30) {
                riskPercent = 90;
                riskLevel = 'Критический';
                riskColor = '#e17055';
            } else if (hitsPerMinute > 20) {
                riskPercent = 70;
                riskLevel = 'Высокий';
                riskColor = '#fdcb6e';
            } else if (hitsPerMinute > 10) {
                riskPercent = 50;
                riskLevel = 'Средний';
                riskColor = '#00b894';
            } else if (hitsPerMinute > 5) {
                riskPercent = 30;
                riskLevel = 'Низкий';
                riskColor = '#667eea';
            } else {
                riskPercent = 10;
                riskLevel = 'Минимальный';
                riskColor = '#667eea';
            }
            
            document.getElementById('riskScore').textContent = `${riskPercent}%`;
            document.getElementById('riskScore').style.color = riskColor;
            document.getElementById('riskLevel').textContent = `Уровень: ${riskLevel}`;
            document.getElementById('riskLevel').style.color = riskColor;
        }
        
        function loadInitialData() {
            fetch('/api/current')
                .then(r => r.json())
                .then(data => {
                    updateDashboard(data);
                });
            
            loadAIChat();
        }
        
        function loadAIChat() {
            fetch('/api/ai/recommendations?limit=5')
                .then(r => r.json())
                .then(data => {
                    const chatDiv = document.getElementById('aiChat');
                    chatDiv.innerHTML = '';
                    
                    if (!Array.isArray(data) || data.length === 0) {
                        chatDiv.innerHTML = '<div class="message info">🤖 AI рекомендаций пока нет</div>';
                        return;
                    }
                    
                    data.slice(0, 3).forEach(msg => {
                        addChatMessage(msg, false);
                    });
                });
        }
        
        function addChatMessage(message, scroll = true) {
            const chatDiv = document.getElementById('aiChat');
            const messageDiv = document.createElement('div');
            
            let messageType = message.type || 'info';
            const msgText = message.message || "";
            
            if (msgText.includes('🔴') || msgText.includes('КРИТИЧЕСКИЙ')) {
                messageType = 'danger';
            } else if (msgText.includes('🟠') || msgText.includes('ВЫСОКАЯ') || msgText.includes('ПОВЫШЕННЫЕ')) {
                messageType = 'warning';
            } else if (msgText.includes('🟡') || msgText.includes('ПОВЫШЕНА')) {
                messageType = 'warning';
            } else if (msgText.includes('✅') || msgText.includes('ХОРОШО') || msgText.includes('ИДЕАЛЬНЫЕ')) {
                messageType = 'success';
            }
            
            messageDiv.className = `message ${messageType}`;
            
            const time = new Date(message.timestamp || new Date());
            const timeStr = time.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            
            messageDiv.innerHTML = `
                <div style="font-size: 14px; line-height: 1.4;">${msgText}</div>
                <div class="message-time">${timeStr}</div>
            `;
            
            chatDiv.insertBefore(messageDiv, chatDiv.firstChild);
            
            while (chatDiv.children.length > 3) {
                chatDiv.removeChild(chatDiv.lastChild);
            }
            
            if (scroll) {
                chatDiv.scrollTop = 0;
            }
        }
        
        // ФУНКЦИИ ГРАФИКОВ
        function loadCharts() {
            fetch('/api/history?hours=1')
                .then(r => r.json())
                .then(historyData => {
                    createCharts(historyData);
                });
        }
        
        function createCharts(historyData) {
            if (!Array.isArray(historyData) || historyData.length === 0) {
                createEmptyCharts();
                return;
            }
            
            // Сортируем по времени
            historyData.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
            
            // Берем последние 30 точек
            const displayData = historyData.slice(-30);
            
            const labels = displayData.map(d => 
                new Date(d.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
            );
            
            const temps = displayData.map(d => d.temperature || 0);
            const hums = displayData.map(d => d.humidity || 0);
            const vibes = displayData.map(d => d.hits_per_minute || 0);
            
            // График температуры
            const tempCtx = document.getElementById('tempChart').getContext('2d');
            if (tempChart) tempChart.destroy();
            
            tempChart = new Chart(tempCtx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Температура (°C)',
                        data: temps,
                        borderColor: '#e17055',
                        backgroundColor: 'rgba(225, 112, 85, 0.1)',
                        tension: 0.4,
                        fill: true,
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: false, grid: { color: 'rgba(0,0,0,0.05)' } },
                        x: { grid: { display: false } }
                    }
                }
            });
            
            // График влажности
            const humCtx = document.getElementById('humChart').getContext('2d');
            if (humChart) humChart.destroy();
            
            humChart = new Chart(humCtx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Влажность (%)',
                        data: hums,
                        borderColor: '#0984e3',
                        backgroundColor: 'rgba(9, 132, 227, 0.1)',
                        tension: 0.4,
                        fill: true,
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: false, grid: { color: 'rgba(0,0,0,0.05)' } },
                        x: { grid: { display: false } }
                    }
                }
            });
            
            // График вибраций
            const vibCtx = document.getElementById('vibChart').getContext('2d');
            if (vibChart) vibChart.destroy();
            
            vibChart = new Chart(vibCtx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Вибрации (уд/мин)',
                        data: vibes,
                        borderColor: '#00b894',
                        backgroundColor: 'rgba(0, 184, 148, 0.1)',
                        tension: 0.4,
                        fill: true,
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, grid: { color: 'rgba(0,0,0,0.05)' } },
                        x: { grid: { display: false } }
                    }
                }
            });
        }
        
        function addDataToCharts(newData) {
            if (!newData.timestamp || !tempChart || !humChart || !vibChart) return;
            
            const time = new Date(newData.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            
            // Добавляем данные в графики
            [tempChart, humChart, vibChart].forEach(chart => {
                if (chart.data.labels.length > 30) {
                    chart.data.labels.shift();
                    chart.data.datasets.forEach(dataset => dataset.data.shift());
                }
                
                chart.data.labels.push(time);
            });
            
            // Температура
            tempChart.data.datasets[0].data.push(newData.temperature || 0);
            tempChart.update('none');
            
            // Влажность
            humChart.data.datasets[0].data.push(newData.humidity || 0);
            humChart.update('none');
            
            // Вибрации
            vibChart.data.datasets[0].data.push(newData.hits_per_minute || 0);
            vibChart.update('none');
        }
        
        function createEmptyCharts() {
            const emptyData = ['Нет данных'];
            const emptyValues = [0];
            
            [document.getElementById('tempChart'), 
             document.getElementById('humChart'), 
             document.getElementById('vibChart')].forEach(canvas => {
                const ctx = canvas.getContext('2d');
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: emptyData,
                        datasets: [{
                            label: 'Нет данных',
                            data: emptyValues,
                            borderColor: '#ccc',
                            backgroundColor: 'rgba(204, 204, 204, 0.1)',
                            fill: true
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } }
                    }
                });
            });
        }
        
        function refreshCharts() {
            loadCharts();
        }
        
        function simulateWarning() {
            fetch('/api/ai/add_recommendation', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    timestamp: new Date().toISOString(),
                    message: '⚠️ ТЕСТ: Система мониторинга работает нормально',
                    type: 'warning'
                })
            })
            .then(() => {
                loadAIChat();
            });
        }
        
        function showHistory() {
            window.open('/api/history?hours=24&format=json', '_blank');
        }
        
        function exportData() {
            fetch('/api/history?hours=24')
                .then(r => r.json())
                .then(data => {
                    const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `arduino-data-${new Date().toISOString().slice(0,10)}.json`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                });
        }
        
        // Инициализация
        window.onload = function() {
            initWebSocket();
            
            // Автообновление графиков каждые 30 секунд
            setInterval(loadCharts, 30000);
            
            // Автообновление AI чата каждую минуту
            setInterval(loadAIChat, 30000);
        };
    </script>
</body>
</html>
